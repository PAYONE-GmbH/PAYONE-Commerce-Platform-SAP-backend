# English localization for payonepcpwebhook types, attributes and enums.
# web-layer messages live in web/webroot/WEB-INF/messages/messages_en.properties.

# ============================================================================
# PayoneWebhookEvent
# ============================================================================

type.PayoneWebhookEvent.name=PAYONE Webhook Event
type.PayoneWebhookEvent.description=Inbound PAYONE webhook event, stored and deduplicated by event id.
type.PayoneWebhookEvent.eventId.name=Event Id
type.PayoneWebhookEvent.eventId.description=Event identifier from PAYONE. Unique, and the key used to recognise a repeated delivery.
type.PayoneWebhookEvent.eventType.name=Event Type
type.PayoneWebhookEvent.eventType.description=Event type as delivered by PAYONE, e.g. payment.captured.
type.PayoneWebhookEvent.merchantId.name=Merchant Id
type.PayoneWebhookEvent.merchantId.description=Merchant identifier carried on the webhook envelope.
type.PayoneWebhookEvent.payload.name=Payload
type.PayoneWebhookEvent.payload.description=Raw webhook body, exactly the bytes the signature was verified over. Kept so the event can be replayed.
type.PayoneWebhookEvent.processed.name=Processed
type.PayoneWebhookEvent.processed.description=Whether the event has been applied. Unprocessed events form the operator backlog and can be replayed.
type.PayoneWebhookEvent.attempts.name=Attempts
type.PayoneWebhookEvent.attempts.description=How many times processing has been attempted.
type.PayoneWebhookEvent.receivedTime.name=Received Time
type.PayoneWebhookEvent.receivedTime.description=When the delivery was received and stored.
type.PayoneWebhookEvent.processedTime.name=Processed Time
type.PayoneWebhookEvent.processedTime.description=When the event was successfully applied.
type.PayoneWebhookEvent.commerceCase.name=Commerce Case
type.PayoneWebhookEvent.commerceCase.description=Commerce case this event was resolved to, if it matched one locally.
type.PayoneWebhookEvent.payoneCheckout.name=Payone Checkout
type.PayoneWebhookEvent.payoneCheckout.description=Payone checkout this event was resolved to, if it matched one locally.
