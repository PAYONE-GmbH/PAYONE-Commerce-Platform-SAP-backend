# -----------------------------------------------------------------------
# payonepcpwebhook project properties
# -----------------------------------------------------------------------
# Spring context contributed to the global platform application context.
payonepcpwebhook.application-context=payonepcpwebhook-spring.xml

# --- Webhook receiver ---------------------------------------------------
# Endpoint registered in the PAYONE Portal (Configuration > Webhooks):
#   https://<host>/payonepcpwebhook/webhooks        (POST, HTTPS, port 443)
#
# HMAC CREDENTIAL — resolved per merchantId from PayoneConfiguration
# (payonepcpcore), not from flat properties here. The envelope's merchantId
# selects the configuration; the delivered X-GCS-KeyId header must match its
# apiKeyId (non-secret, set on the item), and the MAC is keyed by its
# apiSecret. The secret itself is NOT SET HERE, AND MUST NOT BE — it is
# resolved at runtime from:
#   payone.pcp.<merchantId>.apiSecret
# Supply the value through CCv2 environment properties / the secret store. Never
# commit it to this file, local.properties, ImpEx or items.xml.
#
# With no PayoneConfiguration for the delivered merchantId, a keyId that
# doesn't match its apiKeyId, or no apiSecret configured, the receiver
# fails CLOSED — every delivery is rejected with 401 and PAYONE retries for
# ~35 hours.

# apiVersion values this build claims to understand. An event on any other
# version is verified and stored but NOT processed, and is answered 204 so PAYONE
# stops retrying — it stays queryable as processed=false and can be replayed.
payonepcpwebhook.apiversion.supported=v1

# User the receiver switches to before writing (see
# DefaultPayoneWebhookReceiverService). The endpoint is unauthenticated, so there
# is no session user to inherit. Point this at a dedicated, narrowly-scoped
# technical user in production; a value that does not resolve is fatal by design
# rather than falling back to admin.
payonepcpwebhook.process.user=admin

# Largest body the receiver will buffer. The whole body must be held in memory to
# compute the HMAC, and that cost is paid before the signature can be checked, so
# on an unauthenticated endpoint the bound is a DoS control, not a nicety.
# Real PCP envelopes are single-digit KB.
payonepcpwebhook.max.body.bytes=1048576

# --- Firewall (PCP webhook guide, "Step 2") ---------------------------------
# Deliveries arrive over HTTPS on port 443 from fixed PAYONE addresses. Allow
# these at the FIREWALL / load balancer, not in application code — the wrong
# layer, and it would silently break the moment PAYONE adds an address.
#   Preprod: 82.98.224.158, 3.75.34.70, 3.127.45.36, 18.198.31.240
#   Prod:    185.60.20.0/24, 52.57.137.71, 3.69.190.236, 3.64.115.185

# --- OpenAPI metadata -------------------------------------------------------
payonepcpwebhook.api.title=PAYONE Commerce Platform Webhook API
payonepcpwebhook.api.description=Inbound webhook receiver for PAYONE Commerce Platform events
payonepcpwebhook.api.version=1.0.0
payonepcpwebhook.sap.apiType=REST
payonepcpwebhook.sap.shortText=PAYONE PCP webhook receiver
payonepcpwebhook.sap.state=Active
payonepcpwebhook.sap.servers=default
payonepcpwebhook.sap.server.default.url=https://{url}/payonepcpwebhook
payonepcpwebhook.sap.server.default.description=PAYONE PCP webhook endpoint
payonepcpwebhook.sap.server.default.templates.url.description=SAP Commerce Cloud server URL where the application is deployed.

# Static OpenAPI docs via the wsStaticDoc ant task.
payonepcpwebhook.documentation.static.generate=true

# --- Security ---------------------------------------------------------------
# This webapp is called by PAYONE, not by a browser, and serves JSON only.
# Lock the CSP down to nothing; there is no page to render.
payonepcpwebhook.xss.filter.header.Content-Security-Policy=default-src 'none'; frame-ancestors 'none'
