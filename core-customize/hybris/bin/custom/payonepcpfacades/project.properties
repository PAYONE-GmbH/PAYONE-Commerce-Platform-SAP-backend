# Spring context contributed to the global platform application context.
payonepcpfacades.application-context=payonepcpfacades-spring.xml

# No PCP credentials here. This layer only assembles DTOs; configuration is
# resolved through the payonepcpcore configuration service.

# Backoffice Capture/Refund actions on PayoneCheckout. Off by default; enable per environment.
payonepcp.backoffice.paymentactions.enabled=false
# Group whose members may trigger the actions (checked server-side on every call).
payonepcp.backoffice.paymentactions.usergroup=admingroup
