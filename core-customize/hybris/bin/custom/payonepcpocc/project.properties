# -----------------------------------------------------------------------
# payonepcpocc project properties
# -----------------------------------------------------------------------
# Spring context contributed to the global platform application context.
payonepcpocc.application-context=payonepcpocc-spring.xml

# This extension has no webmodule of its own; its controllers are mounted into
# the commercewebservices OCC v2 webapp.
ext.payonepcpocc.extension.webmodule.webroot=/occ/v2

# Generate static OpenAPI/Swagger docs for the PCP endpoints via the
# wsStaticDoc ant task.
payonepcpocc.documentation.static.generate=true

# NOTE: no PCP credentials here. The merchant JWT is minted server
# side by payonepcpcore; nothing secret is ever exposed over OCC.
