# Deutsche Lokalisierung fuer payonepcpcore-Typen, -Attribute und -Enums.
# Muss Schluessel fuer Schluessel zu payonepcpcore-locales_en.properties passen,
# sonst faellt Backoffice auf den rohen Qualifier zurueck ("merchantId").
#
# PCP-Fachbegriffe (Checkout, Commerce Case, Capture, Token, Chargeback, Card
# on File) bleiben englisch, wie in Support und PAYONE-Dokumentation ueblich.
#
# Kodierung: UTF-8. Diese Datei ist die einzige mit Nicht-ASCII-Zeichen.

