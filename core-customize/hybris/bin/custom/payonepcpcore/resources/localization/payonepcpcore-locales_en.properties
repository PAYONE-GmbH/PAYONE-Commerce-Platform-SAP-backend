# English localization for payonepcpcore types, attributes and enums.
#
# Every itemtype and attribute declared in payonepcpcore-items.xml needs a
# .name entry here, or Backoffice and the HAC type browser show the raw
# qualifier ("merchantId") instead.
#
# .description entries are Backoffice hover help, condensed from the
# <description> elements in items.xml; items.xml keeps the full engineering
# rationale (ADR references, PCP OpenAPI sourcing notes).
#
# Platform types we only add attributes to (BaseStore, Order,
# PaymentTransaction) have no type.<Type>.name/.description - the platform
# owns those labels.
#
# Keep this file ASCII; only the _de file needs non-ASCII characters.

