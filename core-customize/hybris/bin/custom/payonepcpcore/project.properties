# -----------------------------------------------------------------------
# payonepcpcore project properties
# -----------------------------------------------------------------------
# Spring context contributed to the global platform application context.
payonepcpcore.application-context=payonepcpcore-spring.xml

# PCP credentials (apiKey / apiSecret) are not stored here or in items.xml/ImpEx.
# The config service resolves them from CCv2 environment properties / secret store
# at runtime. Only non-secret defaults belong in property files.

# HTTP timeouts (seconds) for calls to the PAYONE Commerce Platform API.
# Overridable per CCv2 environment without a redeploy - a slow upstream is
# an ops issue, not a code change.
payone.pcp.http.connectTimeoutSeconds=10
payone.pcp.http.readTimeoutSeconds=30
payone.pcp.http.writeTimeoutSeconds=30
